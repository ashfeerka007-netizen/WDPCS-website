<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Architectural Room Lines -->
  <rect x="40" y="40" width="520" height="320" rx="12" fill="#1e3a5f" stroke="#334155" stroke-width="2"/>
  
  <!-- Bed & Furniture vector layout -->
  <rect x="180" y="160" width="240" height="140" rx="8" fill="#2563eb" opacity="0.3"/>
  <rect x="195" y="140" width="100" height="40" rx="4" fill="#ffffff" opacity="0.85"/>
  <rect x="305" y="140" width="100" height="40" rx="4" fill="#ffffff" opacity="0.85"/>
  <rect x="180" y="210" width="240" height="90" rx="6" fill="#1d4ed8" opacity="0.4"/>
  <rect x="120" y="180" width="45" height="50" rx="4" fill="#64748b" opacity="0.5"/>
  <rect x="435" y="180" width="45" height="50" rx="4" fill="#64748b" opacity="0.5"/>
  
  <!-- Window & Curtains -->
  <rect x="80" y="70" width="120" height="70" rx="4" fill="#38bdf8" opacity="0.2" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="140" y1="70" x2="140" y2="140" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="80" y1="105" x2="200" y2="105" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- Badge Overlay -->
  <rect x="170" y="295" width="260" height="42" rx="8" fill="#0a192f" stroke="#dfa233" stroke-width="1.5"/>
  <text x="300" y="322" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Society Guest Rooms</text>
  
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Wayanad District Police Co-operative Society Ltd. No. W 208</text>
</svg>
